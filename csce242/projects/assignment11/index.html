<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vacation Destinations</title>

    <!-- W3.CSS -->
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">

    <!-- My CSS -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="w3-container w3-teal w3-center">
        <h1>Vacation Destinations</h1>
        <p>Click a destination to learn more!</p>
    </header>

    <main id="vacation-list" class="w3-row-padding">
    </main>


    <!-- Modal -->
    <div id="vacation-modal" class="w3-modal">

        <div class="w3-modal-content w3-card-4">

            <!-- Modal Header -->
            <header class="w3-container w3-teal">

                <span onclick="closeModal()"
                      class="w3-button w3-display-topright">
                    &times;
                </span>

                <h2 id="modal-title"></h2>

            </header>


            <!-- Modal Body -->
            <div class="w3-container">

                <img id="modal-image"
                     src=""
                     alt="Vacation destination">

                <h3 id="modal-type"></h3>

                <p id="modal-description"></p>

                <h3>Things To Do</h3>

                <p id="modal-things"></p>

                <h3>Map</h3>

                <iframe id="modal-map"></iframe>

            </div>


            <!-- Modal Footer -->
            <footer class="w3-container w3-teal">

                <button onclick="closeModal()"
                        class="w3-button w3-white">
                    Close
                </button>

            </footer>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
