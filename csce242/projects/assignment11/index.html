<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vacation Destinations</title>

    <!-- W3.CSS -->
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">

    <!-- My Styles -->
    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <header class="w3-container w3-teal w3-center">
        <h1>Vacations</h1>
        <p>Vacation Experiences</p>
    </header>


    <main id="vacation-list" class="w3-row-padding">
    </main>


    <!-- Modal -->
    <div id="vacation-modal" class="w3-modal">

        <div class="w3-modal-content w3-card-4">

            <!-- Close Button -->
            <span onclick="closeModal()"
                  class="w3-button w3-display-topright">
                &times;
            </span>


            <div class="modal-body">

                <!-- Map -->
                <div class="modal-map">

                    <iframe id="modal-map"></iframe>

                </div>


                <!-- Vacation Information -->
                <div class="modal-info">

                    <h2 id="modal-title"></h2>

                    <p>
                        <strong>Type:</strong>
                        <span id="modal-type"></span>
                    </p>

                    <p>
                        <strong>Description:</strong>
                        <span id="modal-description"></span>
                    </p>

                    <p>
                        <strong>Things To Do:</strong>
                        <span id="modal-things"></span>
                    </p>

                </div>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
