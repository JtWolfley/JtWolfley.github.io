<!DOCTYPE html>
<html>
    <head>
        <title>JavaScript Assignment</title>
        <link rel="stylesheet" href="styles.css">
        <script src="script.js" defer></script>
    </head>

    <body>

        <header>
            <h1>JavaScript Assignment</h1>
        </header>

        <main id="content">

            <!-- Speech -->
            <section id="speech" class="column">
                <h2>Speech</h2>
                <p>Click this column.</p>

                <div id="speech-bubble" class="hidden">
                    Hello!
                </div>
            </section>


            <!-- Beverage -->
            <section class="column">
                <h2>Beverage</h2>

                <select id="beverage">
                    <option>Select a Beverage</option>
                    <option>Water</option>
                    <option>Coffee</option>
                    <option>Tea</option>
                    <option>Soda</option>
                </select>

                <p id="beverage-output"></p>
            </section>


            <!-- Sticker -->
            <section class="column">
                <h2>Sticker</h2>
                <p>Click the image.</p>

                <div id="image-area">
                    <img
                        id="sticker-image"
                        src="https://placehold.co/300x200"
                        alt="Placeholder">

                    <span id="sticker" class="hidden"></span>
                </div>
            </section>

        </main>

        <footer>
            <p>&copy; Johnathan Wolfley</p>
        </footer>

    </body>
</html>
